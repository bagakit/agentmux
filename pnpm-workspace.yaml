packages:
  - packages/*
  - apps/*

allowBuilds:
  electron: true
  esbuild: true
  protobufjs: false

overrides:
  '@ctxmux/sdk@0.0.0': file:packages/core/vendor/ctxmux/darwin-arm64/ctxmux-sdk-0.0.0.tgz

# @ctxmux/sdk is a locally vendored `file:` tarball (see overrides above), not a
# registry package. pnpm 11.5's default `minimumReleaseAge` supply-chain gate
# treats its lockfile entry (which carries an integrity hash + `tarball:` field)
# as a registry dependency and tries to look up a publish date on npmjs, which
# 404s and fails every install/build. A `file:` tarball has no registry release
# date, so it is categorically outside what minimumReleaseAge is meant to guard.
# Excluding only this one vendored package keeps the release-age policy fully in
# force for every real registry dependency.
minimumReleaseAgeExclude:
  - '@ctxmux/sdk'
  - '@larksuiteoapi/node-sdk@1.76.0'

patchedDependencies:
  '@radix-ui/react-menu@2.1.20': patches/@radix-ui__react-menu@2.1.20.patch
  '@radix-ui/react-roving-focus@1.1.15': patches/@radix-ui__react-roving-focus@1.1.15.patch
  monaco-editor@0.56.0: patches/monaco-editor@0.56.0.patch
  '@xterm/xterm@6.1.0-beta.303': patches/@xterm__xterm@6.1.0-beta.303.patch
  node-diff3@3.2.1: patches/node-diff3@3.2.1.patch
  electron-vite@5.0.0: patches/electron-vite@5.0.0.patch
  '@radix-ui/react-focus-scope@1.1.16': patches/@radix-ui__react-focus-scope@1.1.16.patch
  '@radix-ui/react-dismissable-layer@1.1.19': patches/@radix-ui__react-dismissable-layer@1.1.19.patch
  react-remove-scroll@2.7.2: patches/react-remove-scroll@2.7.2.patch
  react-remove-scroll-bar@2.3.8: patches/react-remove-scroll-bar@2.3.8.patch
  react-style-singleton@2.2.3: patches/react-style-singleton@2.2.3.patch
