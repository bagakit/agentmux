  <polygon points="17,29.5 32,31.2 47,29.2 45.5,30.6 32,32.2 18.5,30.8" fill="#4ad496" opacity=".45"/>

  <!-- Expressive dual glowing emerald companion eyes -->
  <polygon points="20,33.2 26.5,32.8 27.2,37.8 19.6,37.8" fill="#6ffad0"/>
  <polygon points="36.8,32.6 44,32.2 44.6,37.6 36.4,37.6" fill="#6ffad0"/>
