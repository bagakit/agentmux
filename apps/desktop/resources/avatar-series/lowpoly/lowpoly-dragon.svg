  <rect width="64" height="64" fill="#171b20"/>
  <!-- Soft ambient rim -->
  <circle cx="32" cy="34" r="24" fill="#1b3a30" opacity=".32"/>

  <!-- Swept-back obsidian & emerald dragon horns (brand dragon motif) -->
