<!doctype html><html><head><meta charset="UTF-8"><title>Private option menu proof</title>
<style>body{margin:0;padding:32px;background:var(--bg);color:var(--text);font-family:system-ui}#root{height:auto;min-height:0}.proof-page{max-width:960px;margin:auto}.proof-page h1{font-size:20px;margin:0 0 8px}.proof-page p{color:var(--text-2);margin-bottom:24px}.proof-page textarea{display:block;width:100%;height:88px;padding:14px;margin-bottom:32px;color:var(--text);background:var(--surface-1);border:1px solid var(--line-soft);border-radius:8px;resize:none}.proof-options{display:flex;align-items:flex-start;gap:24px}.proof-entry{min-height:78px;min-width:130px}.proof-entry>small{display:block;margin-bottom:12px;color:var(--text-2)}.proof-entry .recall-notebook-selector{min-width:190px}.proof-row{display:flex;align-items:center;gap:12px}.proof-dialog{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:340px;padding:22px;background:var(--surface-2);color:var(--text);border-radius:10px;box-shadow:var(--elev-3)}.proof-dialog input{display:block;margin:16px 0;width:100%;padding:10px;color:var(--text);background:var(--surface-1);border:1px solid var(--line-soft);border-radius:5px}</style></head><body><div id="root"></div><script type="module" src="./entry.tsx"></script></body></html>
