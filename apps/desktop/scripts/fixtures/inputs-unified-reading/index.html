<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inputs unified reading — private Native fixture</title><link rel="stylesheet" href="entry.css"><style>
html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--app-bg);color:var(--text)}
.inputs-native-fixture{height:100%;display:flex;flex-direction:column;background:var(--panel-bg)}
.inputs-native-fixture__heading{padding:16px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--border);font-size:14px}
.inputs-native-fixture__heading span{font-size:11px;color:var(--muted)}
.inputs-native-fixture__workface{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.inputs-native-fixture__context{flex:1;padding:20px 16px;font-size:13px;color:var(--muted)}
.inputs-native-fixture__context p{font-size:12px;line-height:1.6}
</style></head><body><div id="root"></div><div data-overlay-host></div><script type="module" src="entry.js"></script></body></html>
